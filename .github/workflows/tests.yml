name: Tests and offline package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test and build tools
        run: python -m pip install 'setuptools>=69' wheel build twine 'pytest>=8' 'scipy==1.12.0'
      - name: Complete public test suite
        run: python -m pytest -q -p no:cacheprovider
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Validate PyPI metadata and description
        run: python -m twine check --strict dist/*
      - name: Offline smoke in a separate base environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/s2-smoke-venv"
          "$RUNNER_TEMP/s2-smoke-venv/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/s2-smoke-venv/bin/python" -I -B "$GITHUB_WORKSPACE/tests/installed_smoke.py" "$RUNNER_TEMP/s2-smoke-venv" "$GITHUB_WORKSPACE/examples"
      - name: Save checked release distributions
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
